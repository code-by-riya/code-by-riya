<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="title desc">
  <title id="title">R monogram with coding motif</title>
  <desc id="desc">A bold white letter R centered on a teal circular field with a small code symbol "&lt;/&gt;" underneath. Designed for GitHub profile use.</desc>
  <!-- transparent canvas -->
  <rect width="100%" height="100%" fill="none" />
  <!-- teal circular field -->
  <circle cx="200" cy="200" r="180" fill="#0ea5a4" />
  <!-- subtle inner shadow for depth -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="8" />
  <!-- Monogram R -->
  <text x="200" y="240" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="800" font-size="170" fill="#ffffff">R</text>
  <!-- coding motif: small angle-bracket tag under the R -->
  <text x="200" y="310" text-anchor="middle" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace" font-weight="700" font-size="32" fill="#ffffff" opacity="0.95">&lt;/&gt;</text>
</svg>